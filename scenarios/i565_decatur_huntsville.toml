name = "I-565 Decatur - Huntsville"
description = """I-565 from I-65 at Decatur (mile 0) to US 72 in Huntsville (mile 22.1), both directions, closed into a ring through the end loops. \
Exits, mileposts and speed limits follow the Wikipedia exit list; the County Line Rd - Wall-Triana stretch is two lanes each way (widening work zone, due 2027) \
and the highway narrows to two lanes east of Memorial Parkway. Ramp volumes are estimates calibrated to ~70,000 vehicles/day through Madison: \
morning peak eastbound toward Redstone Arsenal and Research Park, evening peak westbound. Left: all human. Right: all auto."""
